[package]
name = "gitloom-tui"
version = "0.1.0"
edition = "2024"
# The event loop uses let-chains, which are stable only from 1.88 on edition 2024.
# Enforced by the `msrv` job in .github/workflows/ci.yml, which reads this
# value, so a wrong number here fails CI rather than misleading contributors.
rust-version = "1.88"

description = "A fast, lightweight TUI for exploring Git history"
license = "MIT"
repository = "https://github.com/greenbugx/GitLoom"
homepage = "https://github.com/greenbugx/GitLoom"
readme = "README.md"
keywords = ["git", "tui", "terminal", "git-history", "git-graph"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "gitloom"
path = "src/lib.rs"

[[bin]]
name = "gitloom"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
crossterm = "0.29.0"
git2 = "0.21.0"
ratatui = "0.30.2"
unicode-width = "0.2.0"

[dev-dependencies]
tempfile = "3.15"
